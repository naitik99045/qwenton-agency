<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <style>
      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      .rotor-outer {
        transform-origin: 120px 120px;
        animation: spinClockwise 24s linear infinite;
      }
      .rotor-inner {
        transform-origin: 120px 120px;
        animation: spinCounter 16s linear infinite;
      }
      .core-pulse {
        transform-origin: 120px 120px;
        animation: pulseGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Die-Cut Disc (Deep Forest Pine - Zero Black) -->
  <circle cx="120" cy="120" r="112" fill="#163A29" stroke="#25543F" stroke-width="2.5" />
  <circle cx="120" cy="120" r="108" fill="none" stroke="#12E896" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Rotating Outer Technical Scale -->
  <g class="rotor-outer">
    <circle cx="120" cy="120" r="98" stroke="#12E896" stroke-width="1.5" stroke-dasharray="2 10" opacity="0.8" />
    <circle cx="120" cy="120" r="92" stroke="#6F907E" stroke-width="1" stroke-dasharray="1 6" opacity="0.5" />
    
    <!-- Coordinate / Degree Markers -->
    <text x="120" y="28" fill="#12E896" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle" letter-spacing="1">000° PROTOCOL</text>
    <text x="212" y="123" fill="#12E896" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle" letter-spacing="1">090°</text>
    <text x="120" y="217" fill="#12E896" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle" letter-spacing="1">180° VERIFIED</text>
    <text x="28" y="123" fill="#12E896" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle" letter-spacing="1">270°</text>
  </g>

  <!-- Rotating Counter Dial Teeth -->
  <g class="rotor-inner">
    <circle cx="120" cy="120" r="76" stroke="#FDFAF6" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.35" />
    <path d="M120 48 L120 54 M192 120 L186 120 M120 192 L120 186 M48 120 L54 120" stroke="#12E896" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Inner Telemetry Core -->
  <g class="core-pulse">
    <circle cx="120" cy="120" r="54" fill="#0E261B" stroke="#12E896" stroke-width="1.5" />
    <polygon points="120,78 156,120 120,162 84,120" fill="none" stroke="#12E896" stroke-width="1.5" opacity="0.7" />
    <circle cx="120" cy="120" r="18" fill="#163A29" stroke="#12E896" stroke-width="2" />
    <circle cx="120" cy="120" r="6" fill="#12E896" />
    <text x="120" y="104" fill="#FDFAF6" font-family="sans-serif" font-size="7" font-weight="900" text-anchor="middle" letter-spacing="1.5">QWENTON</text>
    <text x="120" y="142" fill="#12E896" font-family="monospace" font-size="6" font-weight="bold" text-anchor="middle" letter-spacing="1">AUTONOMOUS</text>
  </g>
</svg>
